<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek 峰谷定价</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 20% -10%, #1a3a5c 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 110%, #0f2c4a 0%, transparent 55%),
                #0b1424;
    color: #e8f1fb;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }
  .glow {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .peak-glow {
    background: radial-gradient(1200px 600px at 20% -10%, #c05555 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 110%, #a04040 0%, transparent 55%),
                #7a3030;
  }
  .valley-glow {
    background: radial-gradient(1200px 600px at 20% -10%, #3f8f5f 0%, transparent 60%),
                radial-gradient(1000px 500px at 110% 110%, #2f7a4e 0%, transparent 55%),
                #24503a;
  }
  body.peak   .peak-glow   { opacity: 1; }
  body.valley .valley-glow { opacity: 1; }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 760px;
    background: rgba(18, 18, 30, 0.70);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 22px;
    padding: 34px 36px 30px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
  }
  .header { text-align: center; }
  .clock {
    font-size: 44px;
    font-weight: 700;
    margin-top: 14px;
    font-variant-numeric: tabular-nums;
    color: #ffffff;
  }
  .clock small { font-size: 16px; font-weight: 400; color: #8fb4e8; margin-left: 8px; }
  .period { font-size: 15px; color: #a9c4e8; margin-top: 8px; letter-spacing: 2px; }

  .progress-wrap { margin-top: 24px; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #93aac8;
    margin-bottom: 7px;
  }
  .progress-label #progRemain { color: #b8d2f5; font-variant-numeric: tabular-nums; }
  .progress-bar {
    height: 10px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    transition: width 1s linear;
  }
  .card.peak   .progress-fill { background: linear-gradient(90deg, #ff9d3c, #ffd28a); }
  .card.valley .progress-fill { background: linear-gradient(90deg, #35b7f0, #8fe6ff); }

  .hero { margin-top: 26px; text-align: center; }
  .hero img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 20px;
    border: 2px solid rgba(120, 180, 255, 0.35);
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
    display: block;
    margin: 0 auto;
    background: #0a1420;
  }
  .title {
    margin-top: 20px;
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 4px;
  }
  .subtitle {
    margin-top: 8px;
    font-size: 16px;
    letter-spacing: 2px;
    padding: 6px 16px;
    border-radius: 999px;
    display: inline-block;
    font-weight: 600;
  }
  .title.peak   { color: #ff4d4f; }              /* 高峰：红 */
  .title.valley { color: #52c41a; }              /* 谷时段：绿 */
  .subtitle.peak   { background: rgba(255, 77, 79, 0.15);  color: #ff7875; border: 1px solid rgba(255, 77, 79, 0.45); }
  .subtitle.valley { background: rgba(82, 196, 26, 0.13);  color: #73d13d; border: 1px solid rgba(82, 196, 26, 0.45); }

  table {
    width: 100%;
    margin-top: 26px;
    border-collapse: collapse;
    font-size: 14px;
  }
  caption { font-size: 14px; color: #93aac8; padding-bottom: 10px; letter-spacing: 1px; }
  th, td {
    padding: 12px 10px;
    text-align: center;
    border-bottom: 1px solid rgba(120, 180, 255, 0.12);
  }
  th { color: #b8d2f5; font-weight: 600; background: rgba(255, 255, 255, 0.03); }
  td { color: #dce9fb; font-variant-numeric: tabular-nums; }
  .model-cell { text-align: left; font-weight: 600; color: #7fc1ff; }
  .note { margin-top: 16px; font-size: 12px; color: #6f87a6; line-height: 1.8; text-align: center; }

  /* ===== 自适应缩放：窗口越窄，展示越少、越重要 ===== */
  @media (max-width: 640px) {
    .card { padding: 20px 18px; }
    .clock { font-size: 34px; }
    .clock small { display: block; margin: 4px 0 0; font-size: 13px; }
    .title { font-size: 30px; letter-spacing: 3px; }
    .hero img { width: 150px; height: 150px; }
    .note { display: none; }               /* 先隐藏最次要的底部说明 */
    .period { font-size: 14px; }
    .progress-wrap { margin-top: 16px; }
    table { margin-top: 18px; }
    th, td { padding: 9px 6px; font-size: 13px; }
  }

  @media (max-width: 480px) {
    .card { padding: 14px 12px; border-radius: 14px; }
    .clock { font-size: 27px; }
    .title { font-size: 25px; letter-spacing: 2px; }
    .subtitle { font-size: 14px; padding: 4px 12px; }
    .period { font-size: 12px; letter-spacing: 1px; }
    .hero { margin-top: 14px; }
    .hero img { display: none; }           /* 再隐藏装饰性图片 */
    .progress-bar { display: none; }       /* 隐藏进度条，保留文字倒计时 */
    .progress-label { margin-bottom: 0; }
    th, td { padding: 7px 3px; font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="glow peak-glow"></div>
  <div class="glow valley-glow"></div>
  <div class="card">
    <div class="header">
      <div class="clock" id="clock">--:--:--<small id="date"></small></div>
      <div class="period" id="periodHint">高峰时段 09:00–12:00 / 14:00–18:00</div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span id="progLabel">当前时段进度</span>
          <span id="progRemain">--</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
      </div>
    </div>

    <div class="hero">
      <img id="heroImg" src="梁文峰.png" alt="当前时段">
      <div class="title peak" id="name">梁文峰</div>
      <div class="subtitle" id="subtitle">当前处于高峰时段</div>
    </div>

    <table>
      <caption id="cap">价格单位：元 / 百万 tokens（高峰时段）</caption>
      <thead>
        <tr><th>模型</th><th>输入（缓存命中）</th><th>输入（缓存未命中）</th><th>输出</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="note">
      数据来源：DeepSeek API 官方文档（api-docs.deepseek.com）
    </div>
  </div>

<script>
  const PRICES = {
    peak: {
      title: "高峰时段",
      cap: "价格单位：元 / 百万 tokens（高峰时段）",
      subtitle: "当前处于高峰时段",
      img: "梁文峰.png",
      rows: [
        ["deepseek-v4-flash", "0.10", "3.0", "9.0"],
        ["deepseek-v4-pro",   "0.30", "9.0", "27.0"],
        ["deepseek-v4-flash-vision-exp", "0.10", "3.0", "9.0"]
      ]
    },
    valley: {
      title: "空闲时段",
      cap: "价格单位：元 / 百万 tokens（空闲时段）",
      subtitle: "当前处于空闲（谷）时段",
      img: "梁文谷.png",
      rows: [
        ["deepseek-v4-flash", "0.05", "1.5", "4.5"],
        ["deepseek-v4-pro",   "0.15", "4.5", "13.5"],
        ["deepseek-v4-flash-vision-exp", "0.05", "1.5", "4.5"]
      ]
    }
  };

  const $ = id => document.getElementById(id);
  const clockEl = $("clock"), periodHint = $("periodHint");
  const heroImg = $("heroImg"), nameEl = $("name"), subtitleEl = $("subtitle");
  const cap = $("cap"), tbody = $("tbody");
  const card = document.querySelector(".card"), subtitleDom = document.querySelector(".subtitle");
  const progLabel = $("progLabel"), progRemain = $("progRemain"), progFill = $("progFill");

  // 北京时间（UTC+8，无夏令时，固定偏移最可靠）
  function bjNow() {
    return new Date(Date.now() + 8 * 3600 * 1000); // 读取时一律用 getUTC* 方法
  }

  // 周末（周六/周日）全天不计峰谷
  function isWeekend(d) {
    const w = d.getUTCDay();
    return w === 0 || w === 6;
  }

  // 判断当前是否处于高峰时段：周末恒为低谷，工作日按 9-12、14-18 判断
  function isPeakHour(d) {
    if (isWeekend(d)) return false;
    const h = d.getUTCHours();
    return (h >= 9 && h < 12) || (h >= 14 && h < 18);
  }

  // 分钟 → "X小时YY分" 显示
  function fmt(min) {
    const h = Math.floor(min / 60), m = Math.floor(min % 60);
    return h > 0 ? h + "小时" + String(m).padStart(2, "0") + "分" : m + "分钟";
  }

  let lastKey = null;

  function tick() {
    const bj = bjNow();
    const pad = n => String(n).padStart(2, "0");
    clockEl.innerHTML = `${pad(bj.getUTCHours())}:${pad(bj.getUTCMinutes())}:${pad(bj.getUTCSeconds())}` +
      `<small>${bj.getUTCFullYear()}-${pad(bj.getUTCMonth()+1)}-${pad(bj.getUTCDate())} 周${"日一二三四五六"[bj.getUTCDay()]}</small>`;

    const weekend = isWeekend(bj);
    const peak = isPeakHour(bj);          // 周末自动为 false
    const key = peak ? "peak" : "valley";
    const p = PRICES[key];

    heroImg.src = p.img;
    nameEl.textContent = peak ? "梁文峰" : "梁文谷";
    subtitleEl.textContent = p.subtitle;

    // 名称 / 标签颜色随时段切换
    nameEl.className = "title " + key;
    subtitleDom.className = "subtitle " + key;

    // 时段提示
    periodHint.textContent = weekend
      ? "🟢 今日周末 · 全天按低谷时段计费"
      : (peak
          ? "🔺 高峰时段：9:00–12:00 / 14:00–18:00"
          : "🔻 空闲时段（谷时段）：高峰时段之外");

    // 背景随时段变色
    document.body.classList.toggle("peak", key === "peak");
    document.body.classList.toggle("valley", key === "valley");
    card.classList.toggle("peak", key === "peak");
    card.classList.toggle("valley", key === "valley");

    // 进度条：当前连续时段已过比例 + 距下一切换点倒计时（跨天连续，不重置）
    const nowTs = Date.now(); // 真实 UTC 时间戳（bj.getTime() 带 +8h 偏移，不能用于绝对时间计算）
    const day0 = Date.UTC(bj.getUTCFullYear(), bj.getUTCMonth(), bj.getUTCDate());
    let segStart, segEnd, labelText, remainText;
    if (peak) {
      // 高峰时段（工作日 9:00-12:00 / 14:00-18:00）
      segStart = day0 + (bj.getUTCHours() < 12 ? 1 : 6) * 3600000; // 北京9点=UTC1点 / 14点=UTC6点
      segEnd   = day0 + (bj.getUTCHours() < 12 ? 4 : 10) * 3600000; // 北京12点=UTC4点 / 18点=UTC10点
      labelText = "🔺 高峰时段进行中";
      remainText = "距高峰结束还有 " + fmt((segEnd - nowTs) / 60000);
    } else if (!weekend && bj.getUTCHours() >= 12 && bj.getUTCHours() < 14) {
      // 工作日白天谷段 12:00-14:00
      segStart = day0 + 4 * 3600000; // 北京12点=UTC4点
      segEnd   = day0 + 6 * 3600000; // 北京14点=UTC6点
      labelText = "🔻 低谷时段";
      remainText = "距高峰时段还有 " + fmt((segEnd - nowTs) / 60000);
    } else {
      // 夜间谷段（18:00-次日9:00）与周末：连续低谷
      // 起点：最近一个过去的 工作日18:00
      for (let back = 0; back < 8; back++) {
        const t = day0 - back * 86400000;
        const wd = new Date(t).getUTCDay();
        if (wd >= 1 && wd <= 5) {
          const cand = t + 10 * 3600000; // 北京18点=UTC10点
          if (cand < nowTs) { segStart = cand; break; }
        }
      }
      // 终点：下一个晚于当前时刻的 工作日9:00
      for (let fwd = 0; fwd < 8; fwd++) {
        const t = day0 + fwd * 86400000;
        const wd = new Date(t).getUTCDay();
        if (wd >= 1 && wd <= 5) {
          const cand = t + 1 * 3600000; // 北京9点=UTC1点
          if (cand > nowTs) { segEnd = cand; break; }
        }
      }
      labelText = "🔻 低谷时段";
      remainText = "距高峰时段还有 " + fmt((segEnd - nowTs) / 60000);
    }

    const ratio = Math.max(0, Math.min(1, (nowTs - segStart) / (segEnd - segStart)));
    progFill.style.width = (ratio * 100).toFixed(2) + "%";
    progLabel.textContent = labelText;
    progRemain.textContent = remainText;

    // 价格表仅在时段变化时刷新（避免每秒重建 DOM）
    if (lastKey !== key) {
      lastKey = key;
      cap.textContent = p.cap;
      tbody.innerHTML = p.rows.map(r =>
        `<tr><td class="model-cell">${r[0]}</td><td>${r[1]} 元</td><td>${r[2]} 元</td><td>${r[3]} 元</td></tr>`
      ).join("");
    }
  }

  tick();           // 立即执行一次
  setInterval(tick, 1000);
</script>
</body>
</html>
